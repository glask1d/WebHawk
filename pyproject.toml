[project]
name = "webhawk"
dynamic = ["version"]
description = "Authorized HTTP attack-surface mapper and toolkit shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
screenshots = ["playwright>=1.45.0"]

[project.scripts]
webhawk = "hawk.cli:entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["webhawk"]
packages = ["hawk", "hawk.modules"]

[tool.setuptools.dynamic]
version = {attr = "hawk.VERSION"}
